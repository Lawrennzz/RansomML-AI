<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ransomware Detection - User Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        body { background: #0f172a; color: #0b1220; padding-top: 76px; }
        .wrap { max-width: 1200px; margin: 24px auto; }
        .card { border: 0; border-radius: 14px; box-shadow: 0 10px 24px rgba(2,6,23,.18); margin-bottom: 20px; }
        .card-header { background: #0ea5e9; color: white; border-top-left-radius: 14px; border-top-right-radius: 14px; padding: 15px 20px; }
        .navbar-custom { background: #0f172a; border-bottom: 2px solid #0ea5e9; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .navbar-custom .navbar-brand { color: #0ea5e9; font-weight: bold; }
        .result-badge { font-size: 1.5rem; padding: 15px; border-radius: 10px; margin: 10px 0; }
        .result-safe { background: #d4edda; color: #155724; border: 2px solid #28a745; }
        .result-danger { background: #f8d7da; color: #721c24; border: 2px solid #dc3545; }
        .upload-area { border: 2px dashed #0ea5e9; border-radius: 10px; padding: 40px; text-align: center; background: #f8f9fa; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { background: #e9ecef; border-color: #0284c7; }
        .upload-area.dragover { background: #dbeafe; border-color: #0284c7; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><span style="font-size: 1.5rem;">🛡️</span> Ransomware Detection</a>
            <div class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle text-white" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                        <span id="user-display">User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><h6 class="dropdown-header"><span id="user-role-display">System User</span></h6></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </div>
        </div>
    </nav>
    
    <div class="wrap">
        <!-- Dashboard & Upload Section -->
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">📊 Dashboard & File Upload</h5>
            </div>
            <div class="card-body">
                <!-- CSV Upload Area -->
                <div class="mb-4">
                    <h6 class="mb-3">Upload CSV File for Ransomware Detection</h6>
                    <div class="upload-area" id="upload-area">
                        <input type="file" id="csv-file-input" accept=".csv" style="display: none;">
                        <div id="upload-content">
                            <svg width="48" height="48" fill="currentColor" viewBox="0 0 16 16" style="color: #0ea5e9; margin-bottom: 15px;">
                                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
                                <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/>
                            </svg>
                            <p class="mb-2"><strong>Click to upload or drag and drop</strong></p>
                            <p class="text-muted small">CSV file with PE features</p>
                        </div>
                    </div>
                    <div id="upload-status" class="mt-3"></div>
                </div>

                <!-- Detection Result -->
                <div id="detection-result" style="display: none;">
                    <hr>
                    <h6 class="mb-3">Detection Result</h6>
                    <div id="result-badge" class="result-badge"></div>
                    <div id="result-details" class="mt-3"></div>
                </div>
            </div>
        </div>

        <!-- Upload History -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">📜 Upload History</h5>
                <button id="btn-refresh-history" class="btn btn-sm btn-light">Refresh</button>
            </div>
            <div class="card-body">
                <div id="history-container">
                    <div class="text-center text-muted py-4">No upload history yet</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get current user info
        async function fetchJSON(url, opts) {
            const r = await fetch(url, opts);
            const txt = await r.text();
            let data = {};
            try { data = JSON.parse(txt || '{}'); } catch { data = { success: false, message: txt }; }
            if (!r.ok) throw new Error(data.message || r.statusText);
            return data;
        }

        async function loadUserInfo() {
            try {
                const data = await fetchJSON('/api/current-user');
                if (data.success && data.user) {
                    document.getElementById('user-display').textContent = data.user.username || data.user.email;
                    document.getElementById('user-role-display').textContent = data.user.role_name || 'System User';
                }
            } catch (e) {
                console.error('Failed to load user info:', e);
            }
        }

        // Upload functionality
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('csv-file-input');
        const uploadStatus = document.getElementById('upload-status');
        const detectionResult = document.getElementById('detection-result');
        const resultBadge = document.getElementById('result-badge');
        const resultDetails = document.getElementById('result-details');

        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].name.endsWith('.csv')) {
                fileInput.files = files;
                handleFileUpload(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileUpload(e.target.files[0]);
            }
        });

        async function handleFileUpload(file) {
            const startTime = Date.now();
            detectionResult.style.display = 'none';
            
            // Show progress with timer
            const progressInterval = setInterval(() => {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                uploadStatus.innerHTML = `<div class="alert alert-info">
                    <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                    Analyzing file... (${elapsed}s)
                </div>`;
            }, 100);
            
            uploadStatus.innerHTML = '<div class="alert alert-info"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Uploading and analyzing file...</div>';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const data = await fetchJSON('/api/user/upload-and-predict', {
                    method: 'POST',
                    body: formData
                });

                // Clear progress interval
                clearInterval(progressInterval);

                if (data.success) {
                    const summary = data.summary;
                    
                    // Show result
                    if (summary.has_ransomware) {
                        resultBadge.className = 'result-badge result-danger';
                        resultBadge.innerHTML = `
                            <strong>⚠️ RANSOMWARE DETECTED</strong><br>
                            <span style="font-size: 1.2rem;">${summary.ransomware_detected} out of ${summary.total_files} file(s) contain ransomware</span>
                        `;
                    } else {
                        resultBadge.className = 'result-badge result-safe';
                        resultBadge.innerHTML = `
                            <strong>✅ ALL FILES ARE SAFE</strong><br>
                            <span style="font-size: 1.2rem;">All ${summary.benign_files} file(s) are benign (no ransomware detected)</span>
                        `;
                    }

                    const processingTime = data.processing_time || {};
                    const timeDisplay = processingTime.formatted || `${processingTime.seconds || 0}s`;
                    
                    let ransomwareListHtml = '';
                    if (Array.isArray(data.ransomware_files) && data.ransomware_files.length > 0) {
                        ransomwareListHtml = `
                            <div class="mt-4">
                                <h6>⚠️ Ransomware Files Detected (${data.ransomware_files.length})</h6>
                                <div class="table-responsive">
                                    <table class="table table-sm">
                                        <thead>
                                            <tr>
                                                <th>#</th>
                                                <th>File</th>
                                                <th>Confidence</th>
                                                <th>Risk Level</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${data.ransomware_files.map((file, idx) => `
                                                <tr>
                                                    <td>${idx + 1}</td>
                                                    <td>${file.label}</td>
                                                    <td>${file.confidence?.toFixed ? file.confidence.toFixed(2) : file.confidence}%</td>
                                                    <td>${file.risk_level || '-'}</td>
                                                </tr>
                                            `).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        `;
                    } else if (summary.has_ransomware === false) {
                        ransomwareListHtml = `
                            <div class="mt-4">
                                <div class="alert alert-success mb-0">
                                    ✅ No individual files flagged as ransomware in this upload.
                                </div>
                            </div>
                        `;
                    }
                    
                    resultDetails.innerHTML = `
                        <div class="row g-3">
                            <div class="col-md-3">
                                <div class="p-3 bg-light rounded">
                                    <div class="text-muted small">Total Files</div>
                                    <div class="fs-4 fw-bold">${summary.total_files}</div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="p-3 bg-light rounded">
                                    <div class="text-muted small">Ransomware Detected</div>
                                    <div class="fs-4 fw-bold text-danger">${summary.ransomware_detected}</div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="p-3 bg-light rounded">
                                    <div class="text-muted small">Benign Files</div>
                                    <div class="fs-4 fw-bold text-success">${summary.benign_files}</div>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="p-3 bg-light rounded">
                                    <div class="text-muted small">⏱️ Analysis Time</div>
                                    <div class="fs-4 fw-bold text-info">${timeDisplay}</div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3 small text-muted">
                            <strong>File:</strong> ${summary.filename}<br>
                            <strong>Uploaded:</strong> ${new Date(summary.timestamp).toLocaleString()}<br>
                            <strong>Processing Time:</strong> ${timeDisplay} (${processingTime.milliseconds || 0}ms)
                        </div>
                        ${ransomwareListHtml}
                    `;

                    detectionResult.style.display = 'block';
                    uploadStatus.innerHTML = '<div class="alert alert-success">✅ File analyzed successfully!</div>';
                    
                    // Refresh history
                    loadUploadHistory();
                } else {
                    clearInterval(progressInterval);
                    uploadStatus.innerHTML = `<div class="alert alert-danger">❌ ${data.message}</div>`;
                }
            } catch (e) {
                clearInterval(progressInterval);
                uploadStatus.innerHTML = `<div class="alert alert-danger">❌ Error: ${e.message}</div>`;
            }
        }

        // Upload History
        async function loadUploadHistory() {
            const container = document.getElementById('history-container');
            container.innerHTML = '<div class="text-center text-muted py-2">Loading...</div>';

            try {
                const data = await fetchJSON('/api/user/upload-history?limit=50');
                if (data.success && data.history && data.history.length > 0) {
                    const history = data.history.reverse(); // Show newest first
                    let html = '<div class="table-responsive"><table class="table table-sm table-striped"><thead><tr>';
                    html += '<th>Date & Time</th><th>Filename</th><th>Total Files</th><th>Ransomware</th><th>Benign</th><th>Status</th><th>Detected Files</th></tr></thead><tbody>';
                    
                    history.forEach(entry => {
                        const date = new Date(entry.timestamp);
                        const statusBadge = entry.has_ransomware 
                            ? '<span class="badge bg-danger">⚠️ Ransomware</span>'
                            : '<span class="badge bg-success">✅ Safe</span>';
                        const detectedFiles = (entry.ransomware_files && entry.ransomware_files.length)
                            ? entry.ransomware_files.map(f => f.label || `Row ${ (f.row_index ?? 0) + 1 }`).slice(0, 3).join(', ') + (entry.ransomware_files.length > 3 ? ' +' + (entry.ransomware_files.length - 3) + ' more' : '')
                            : '-';
                        
                        html += `<tr>
                            <td>${date.toLocaleString()}</td>
                            <td>${entry.filename}</td>
                            <td>${entry.total_rows}</td>
                            <td class="text-danger">${entry.ransomware_detected}</td>
                            <td class="text-success">${entry.benign_count}</td>
                            <td>${statusBadge}</td>
                            <td>${detectedFiles}</td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table></div>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div class="text-center text-muted py-4">No upload history yet</div>';
                }
            } catch (e) {
                container.innerHTML = `<div class="alert alert-danger">Error loading history: ${e.message}</div>`;
            }
        }

        document.getElementById('btn-refresh-history').addEventListener('click', loadUploadHistory);

        // Initialize
        loadUserInfo();
        loadUploadHistory();
    </script>
</body>
</html>
